[project]
name = "agent-ops-diag"
version = "0.1.0"
description = "Agent Ops 诊断辅助服务（骨架占位）：自研显式状态机 + 统一模型网关（ADR-004）"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    # OpenAPI -> Pydantic 代码生成（ADR-002）。
    # 工程默认值（默认值，待运维确认，Q18）：下一批次接入。
    "datamodel-code-generator>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_ops_diag"]